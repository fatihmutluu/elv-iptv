appId: io.github.fatihmutluu.elviptv
productName: ELV IPTV
asar: true
npmRebuild: false
directories:
  output: release
  buildResources: resources
files:
  - dist/main/**
  - dist/preload/**
  - dist/renderer/**
  - dist/utility/**
  - package.json
  - node_modules/better-sqlite3/package.json
  - node_modules/better-sqlite3/lib/**
  - node_modules/better-sqlite3/prebuilds/**
  - "!node_modules/@elv/**"
  - "!**/node_modules/node-addon-api/**"
  - "!**/node_modules/better-sqlite3/deps/**"
  - "!**/node_modules/better-sqlite3/src/**"
asarUnpack:
  - "**/node_modules/better-sqlite3/prebuilds/**"
icon: resources/icon.png
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  fileAssociations:
    - ext:
        - m3u
        - m3u8
      name: M3U Playlist
      description: M3U IPTV Playlist
  extraResources:
    - from: resources/mpv/win32-x64
      to: mpv
    - from: resources/mpv-input.conf
      to: mpv-input.conf
    - from: resources/fonts
      to: fonts
  target:
    - dir

# Microsoft Store MSIX package (`pnpm --filter @elv/desktop run package:msix`).
# Identity and publisher are placeholders: Partner Center assigns the real values when the app name is reserved.
appx:
  identityName: PLACEHOLDER.StoreAssignedIdentity
  publisher: CN=PLACEHOLDER-StoreAssignedPublisher
  publisherDisplayName: ELV IPTV
  displayName: ELV IPTV
  applicationId: ELVIPTV
  backgroundColor: "#0b0e14"
  showNameOnTiles: true
  capabilities:
    - runFullTrust
    - internetClient
    - privateNetworkClientServer
  languages:
    - en-US
    - tr-TR

mac:
  category: public.app-category.entertainment
  fileAssociations:
    - ext:
        - m3u
        - m3u8
      name: M3U Playlist
      role: Viewer
  extendInfo:
    ITSAppUsesNonExemptEncryption: false
    NSLocalNetworkUsageDescription: ELV IPTV uses your local network to discover AirPlay receivers and pair devices over QR code.
    NSAppTransportSecurity:
      NSAllowsArbitraryLoads: true
  # Ad-hoc sign (`-`) without hardened runtime so Apple Silicon accepts the fused unpacked bundle in CI (`package:mas` signs for Mac App Store).
  identity: "-"
  hardenedRuntime: false
  extraResources:
    - from: resources/mpv/darwin-arm64
      to: mpv
    - from: resources/mpv-input.conf
      to: mpv-input.conf
    - from: resources/fonts
      to: fonts
  target:
    - dir
mas:
  # Clear inherited mac.identity ("-") so package:mas uses CSC_NAME / Apple Distribution keychain auto-discovery.
  identity: ""
  entitlements: resources/entitlements.mas.plist
  entitlementsInherit: resources/entitlements.mas.inherit.plist
  hardenedRuntime: false
  category: public.app-category.entertainment
  type: distribution

linux:
  # The default name comes from the scoped package name, which is not a valid file name.
  executableName: elv-iptv
  category: AudioVideo
  fileAssociations:
    - ext:
        - m3u
        - m3u8
      name: M3U Playlist
      mimeType: audio/x-mpegurl
  extraResources:
    - from: resources/mpv-input.conf
      to: mpv-input.conf
    - from: resources/fonts
      to: fonts
  target:
    - AppImage
