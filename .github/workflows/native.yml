name: Native builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No workflow-level "paths:" filter: the build jobs below are required checks. A job skipped by
# "needs" + "if" reports as skipped, which satisfies a required check; a workflow skipped by
# "paths:" never reports at all and blocks the merge.
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ github.event_name != 'pull_request' || steps.filter.outputs.mobile == 'true' }}
      desktop: ${{ github.event_name != 'pull_request' || steps.filter.outputs.desktop == 'true' }}
      gate: ${{ github.event_name != 'pull_request' || steps.filter.outputs.gate == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            mobile:
              - 'apps/tv-mobile/**'
              - 'modules/**'
              - 'packages/**'
              - 'package.json'
              - '.npmrc'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.node-version'
              - '.github/actions/**'
              - '.github/workflows/native.yml'
            gate:
              - 'packages/focus-core/**'
              - 'packages/ui-kit/**'
              - 'apps/tv-mobile/**'
              - 'tools/src/gates/**'
              - 'tools/bin/gate.ts'
              - 'tools/src/exec.ts'
              - 'docs/learned/gates/**'
              - 'package.json'
              - '.npmrc'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.node-version'
              - '.github/actions/**'
              - '.github/workflows/native.yml'
            desktop:
              - 'apps/desktop/**'
              - 'modules/**'
              - 'packages/**'
              - 'package.json'
              - '.npmrc'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.node-version'
              - '.github/actions/**'
              - '.github/workflows/native.yml'

  android-mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      # Restore everywhere, save only on main.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Generate the Android project
        run: pnpm --filter tv-mobile exec expo prebuild --platform android --no-install
      - name: Build the debug APK
        working-directory: apps/tv-mobile/android
        run: ./gradlew assembleDebug --quiet --no-daemon

  android-tv:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPO_TV: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Generate the Android TV project
        run: pnpm --filter tv-mobile exec expo prebuild --platform android --no-install
      - name: Build the debug APK
        working-directory: apps/tv-mobile/android
        run: ./gradlew assembleDebug --quiet --no-daemon
      - name: Assert the merged manifest declares the leanback feature
        run: |
          manifests=$(find apps/tv-mobile/android/app/build -path '*merged_manifest*' -name AndroidManifest.xml)
          test -n "$manifests" || { echo "no merged manifest found"; exit 1; }
          # Word splitting is intended: grep takes every manifest path.
          # shellcheck disable=SC2086
          grep -q 'android.software.leanback' $manifests || { echo "leanback feature missing from merged manifest"; exit 1; }

  ios:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Expo SDK 58 needs Xcode >= 26.4 (sdk-compatibility.json); 26.4.1 is installed on macos-26.
      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app
      - uses: ./.github/actions/setup
        id: setup
      - name: Restore CocoaPods cache
        id: pods-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-ios-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-cocoapods-ios-
      - name: Generate the iOS project
        run: pnpm --filter tv-mobile exec expo prebuild --platform ios --no-install
      - name: Install pods
        working-directory: apps/tv-mobile/ios
        run: pod install --silent
      - name: Build for the simulator
        working-directory: apps/tv-mobile/ios
        run: |
          workspace=$(ls -d ./*.xcworkspace)
          workspace=${workspace#./}
          xcodebuild -workspace "$workspace" -scheme "${workspace%.xcworkspace}" \
            -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Save the pnpm store
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.store-path }}
          key: ${{ steps.setup.outputs.cache-key }}
      - name: Save CocoaPods cache
        if: github.ref == 'refs/heads/main' && steps.pods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ steps.pods-cache.outputs.cache-primary-key }}

  # First place the tvOS image assets are validated: an asset-catalog error fails xcodebuild and this job.
  tvos:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      EXPO_TV: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app
      - uses: ./.github/actions/setup
        id: setup
      - name: Restore CocoaPods cache
        id: pods-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-tvos-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-cocoapods-tvos-
      - name: Generate the tvOS project
        run: pnpm --filter tv-mobile exec expo prebuild --platform ios --no-install
      - name: Install pods
        working-directory: apps/tv-mobile/ios
        run: pod install --silent
      - name: Build for the Apple TV simulator
        working-directory: apps/tv-mobile/ios
        run: |
          workspace=$(ls -d ./*.xcworkspace)
          workspace=${workspace#./}
          xcodebuild -workspace "$workspace" -scheme "${workspace%.xcworkspace}" \
            -sdk appletvsimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Save CocoaPods cache
        if: github.ref == 'refs/heads/main' && steps.pods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ steps.pods-cache.outputs.cache-primary-key }}

  # Report-only until five green runs on main; then drop continue-on-error and add the job to the "native" needs
  # (spec 2026-11-13-focus-list-gate, section 5.6). The CI emulator (software GPU) is not comparable with the local
  # baseline, so it uses its own file; while that file is absent the gate checks absolute budgets and focus losses only.
  gate-list:
    needs: changes
    if: needs.changes.outputs.gate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    env:
      EXPO_TV: "1"
      APP_VARIANT: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Build before the emulator boots so it does not idle during the Gradle build.
      - name: Generate the Android TV project (development variant)
        run: pnpm --filter tv-mobile exec expo prebuild --clean --platform android --no-install
      - name: Build the release APK (JS bundled, debug-signed)
        working-directory: apps/tv-mobile/android
        run: ./gradlew assembleRelease --quiet --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the list gate on an Android TV emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: pnpm gate list --ci --baseline docs/learned/gates/list-android-tv-ci.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gate-list
          path: gate-artifacts/gate-list.json
          if-no-files-found: warn
          retention-days: 30

  # Report-only tvOS measurement: macOS minutes are expensive, so it runs on main and by hand, never on pull requests.
  # The required "tvos" job above stays a Debug production build that validates the image assets.
  tvos-gate:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    continue-on-error: true
    env:
      EXPO_TV: "1"
      APP_VARIANT: development
      GATE_URL: elviptv://gate/list?items=100000&auto=1&rate=20&moves=600
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app
      - uses: ./.github/actions/setup
        id: setup
      - name: Generate the tvOS project (development variant)
        run: pnpm --filter tv-mobile exec expo prebuild --clean --platform ios --no-install
      - name: Install pods
        working-directory: apps/tv-mobile/ios
        run: pod install --silent
      # Release bundles the JS; a Debug build would need Metro.
      - name: Build for the Apple TV simulator
        working-directory: apps/tv-mobile/ios
        run: |
          workspace=$(ls -d ./*.xcworkspace)
          workspace=${workspace#./}
          xcodebuild -workspace "$workspace" -scheme "${workspace%.xcworkspace}" \
            -sdk appletvsimulator -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Run the list gate on an Apple TV simulator
        working-directory: apps/tv-mobile/ios
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j |
            jq -r '[.devices | to_entries[] | select(.key | test("tvOS")) | .value[] | select(.name | test("Apple TV"))] | .[0].udid // empty')
          if [ -z "$udid" ]; then
            runtime=$(xcrun simctl list runtimes available -j |
              jq -r '[.runtimes[] | select(.platform == "tvOS")] | sort_by(.version) | last | .identifier // empty')
            devtype=$(xcrun simctl list devicetypes -j |
              jq -r '[.devicetypes[] | select(.name | test("Apple TV"))] | last | .identifier // empty')
            if [ -z "$runtime" ] || [ -z "$devtype" ]; then
              echo "no tvOS runtime or Apple TV device type available"
              exit 1
            fi
            udid=$(xcrun simctl create "elv-gate" "$devtype" "$runtime")
          fi
          echo "simulator: $udid"
          xcrun simctl bootstatus "$udid" -b
          app=$(find build/Build/Products/Release-appletvsimulator -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$app" || { echo "no .app found"; exit 1; }
          xcrun simctl install "$udid" "$app"
          log="$RUNNER_TEMP/gate-tvos-log.txt"
          : > "$log"
          xcrun simctl spawn "$udid" log stream --style compact --level debug \
            --predicate 'subsystem == "com.facebook.react.log"' > "$log" 2>&1 &
          stream_pid=$!
          sleep 3
          xcrun simctl openurl "$udid" "$GATE_URL"
          out="$GITHUB_WORKSPACE/gate-tvos.txt"
          found=""
          for _ in $(seq 1 120); do
            if grep -q 'ELV_GATE' "$log"; then found=1; break; fi
            sleep 1
          done
          if [ -n "$found" ]; then
            grep 'ELV_GATE' "$log" | tail -n 1 > "$out"
          else
            { echo "no ELV_GATE within 120 s"; echo "--- log tail ---"; tail -n 50 "$log"; } > "$out"
          fi
          kill "$stream_pid" 2>/dev/null || true
          cat "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gate-tvos
          path: gate-tvos.txt
          if-no-files-found: warn
          retention-days: 30

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26, ubuntu-24.04]
    env:
      # Unsigned builds: electron-builder must not look for a signing identity.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
      - name: Build the desktop app and installers
        run: pnpm --filter @elv/desktop build
      # Ubuntu 24.04 blocks unprivileged user namespaces, which the Chromium sandbox needs.
      - name: Allow the Electron sandbox on Linux
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: End-to-end test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @elv/desktop test:e2e
      - name: End-to-end test
        if: runner.os != 'Linux'
        run: pnpm --filter @elv/desktop test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
          if-no-files-found: error
          retention-days: 7
      - name: Save the pnpm store
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.cache-hit != 'true' && matrix.os == 'windows-2025'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.store-path }}
          key: ${{ steps.setup.outputs.cache-key }}

  # Branch protection requires this job (`native`), not the individual build jobs above.
  native:
    if: always()
    needs: [changes, android-mobile, android-tv, ios, tvos, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when any native job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          if [ "$CHANGES" != success ]; then echo "changes: $CHANGES"; exit 1; fi
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "native job result: $r"; exit 1 ;; esac
          done
