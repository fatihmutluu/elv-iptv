name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target: # zizmor: ignore[dangerous-triggers] no checkout of PR code; the action needs this trigger to comment on fork PRs
    types: [opened, closed, synchronize]

permissions: {}

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target'
      || github.event.comment.body == 'recheck'
      || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      # This workflow never checks out pull request code.
      - uses: step-security/contributor-assistant-github-action@b9bd60bf1b766fa48dae03427059187137236239 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/fatihmutluu/elv-iptv/blob/main/CLA.md
          branch: cla-signatures
          allowlist: fatihmutluu,dependabot[bot],github-actions[bot],release-please[bot]
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
