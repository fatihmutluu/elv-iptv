version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release so updates respect pnpm's minimum release age (zizmor wants at least 7 days).
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    ignore:
      # TypeScript 7 has no tsserver yet; the editor tooling needs 6.x.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Types follow the pinned Node 24 runtime, not the newest Node.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # Expo SDK upgrades move these together with `expo install --fix`; single bumps break the SDK pins.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "jest-expo"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-tvos/*"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]
