version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release so updates respect pnpm's minimum release age (zizmor wants at least 7 days).
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]
