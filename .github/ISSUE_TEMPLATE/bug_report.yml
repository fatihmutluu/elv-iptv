name: Bug report
description: Something does not work as expected
labels: ["type:bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android phone or tablet
        - Android TV
        - Fire TV
        - iPhone
        - iPad
        - Apple TV
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed playlist URLs and credentials from this report
          required: true
