name: Setup workspace
description: Install pnpm, Node from .node-version and the frozen workspace dependencies.
runs:
  using: composite
  steps:
    # The pnpm version comes from "packageManager" in the root package.json.
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    # Node 24 comes from .node-version; it also satisfies devEngines.runtime, so pnpm downloads nothing.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --reporter=silent
